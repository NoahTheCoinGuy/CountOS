<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home - CountOS</title>
    <link rel="stylesheet" href="/CountOS/styles/basic.css">
  </head>
  <body>
    <div class="header" id="AIPolicyHeader">
      <p>We will never use AI on CountOS.</p>
    </div>

    <main class="countdown-grid">
      <!-- Row 1 -->
      <section class="countdown-row">
        <div class="countdown-card" id="countdown-halloween">
          <h2>Halloween</h2>
          <p class="countdown-label">Time remaining:</p>
          <p class="countdown-value">MM-DD-HH-MM-SS</p>
        </div>

        <div class="countdown-card" id="countdown-christmas">
          <h2>Christmas</h2>
          <p class="countdown-label">Time remaining:</p>
          <p class="countdown-value">MM-DD-HH-MM-SS</p>
        </div>
      </section>

      <!-- Row 2 -->
      <section class="countdown-row">
        <div class="countdown-card" id="countdown-easter">
          <h2>Easter</h2>
          <p class="countdown-label">Time remaining:</p>
          <p class="countdown-value">MM-DD-HH-MM-SS</p>
        </div>

        <div class="countdown-card" id="countdown-newyear">
          <h2>New Year</h2>
          <p class="countdown-label">Time remaining:</p>
          <p class="countdown-value">MM-DD-HH-MM-SS</p>
        </div>
      </section>

      <!-- Row 3 -->
      <section class="countdown-row">
        <div class="countdown-card" id="countdown-thanksgiving">
          <h2>Thanksgiving</h2>
          <p class="countdown-label">Time remaining:</p>
          <p class="countdown-value">MM-DD-HH-MM-SS</p>
        </div>

        <div class="countdown-card" id="countdown-custom">
          <h2>Custom</h2>
          <form class="countdown-custom-form">
            <label for="custom-date">Target date (MM-DD-YYYY):</label>
            <input
              type="text"
              id="custom-date"
              name="custom-date"
              placeholder="mm-dd-yyyy"
            >
          </form>
          <p class="countdown-label">Time remaining:</p>
          <p class="countdown-value">MM-DD-HH-MM-SS</p>
        </div>
      </section>
    </main>
  </body>
</html>
