<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home - CountOS</title>
    <link rel="stylesheet" href="/CountOS/styles/basic.css">
  </head>
  <body>
    <div class="header" id="AIPolicyHeader">
      <p>We will never use AI on CountOS.</p>
    </div>

    <main class="countdown-grid">

      <!-- Row 1 -->
      <section class="countdown-row">
        <div class="countdown-card" id="cd-halloween">
          <h2>Halloween</h2>
          <p class="cd-value">MM-DD-HH-MM-SS</p>
        </div>

        <div class="countdown-card" id="cd-christmas">
          <h2>Christmas</h2>
          <p class="cd-value">MM-DD-HH-MM-SS</p>
        </div>
      </section>

      <!-- Row 2 -->
      <section class="countdown-row">
        <div class="countdown-card" id="cd-easter">
          <h2>Easter</h2>
          <p class="cd-value">MM-DD-HH-MM-SS</p>
        </div>

        <div class="countdown-card" id="cd-newyear">
          <h2>New Year</h2>
          <p class="cd-value">MM-DD-HH-MM-SS</p>
        </div>
      </section>

      <!-- Row 3 -->
      <section class="countdown-row">
        <div class="countdown-card" id="cd-thanksgiving">
          <h2>Thanksgiving</h2>
          <p class="cd-value">MM-DD-HH-MM-SS</p>
        </div>

        <div class="countdown-card" id="cd-custom">
          <h2>Custom</h2>
          <label for="custom-date">Target date:</label>
          <input type="text" id="custom-date" placeholder="mm-dd-yyyy">
          <p class="cd-value">MM-DD-HH-MM-SS</p>
        </div>
      </section>

    </main>

    <!-- Connect JS countdown engine -->
    <script src="/CountOS/scripts/cd.js"></script>
  </body>
</html>
